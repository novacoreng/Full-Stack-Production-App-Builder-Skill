name: Validate Skill Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required skill files
        shell: bash
        run: |
          set -euo pipefail
          test -f SKILL.md
          test -f README.md
          grep -q '^---$' SKILL.md
          grep -q '^name: full-stack-production-app-builder$' SKILL.md
          grep -q '^description:' SKILL.md
          test -f workflows/infrastructure.md
          test -f workflows/test-admin.md
          test -f workflows/supply-chain.md
          test -f workflows/reliability.md
          test -f workflows/regulatory-compliance.md
          test -f templates/INFRASTRUCTURE-MATRIX.md
          test -f templates/TEST-ADMIN.md
          test -f templates/REGULATORY-MATRIX.md
          test -f references/standards.md
          test -f workflows/device-interactive-qa.md
          test -f workflows/security.md
          test -f templates/SECURITY.md
          test -f templates/DEVICE_INTERACTIVE_QA.md
          test -f workflows/abuse-cost-controls.md
          test -f workflows/account-deletion-data-retention.md
          test -f workflows/app-store-release.md
          test -f workflows/consumer-trust-privacy.md
          test -f workflows/cloudflare-origin-security.md
          test -f templates/SECURITY_CONTROL_MATRIX.md
          test -f templates/APP_STORE_RELEASE_CHECKLIST.md
          test -f templates/WORKFLOW-COVERAGE-MATRIX.md
          test -f templates/PRE-PRODUCTION-GATES.md
          grep -q 'Interactive runtime verification' SKILL.md
          grep -q 'No silent dead controls' SKILL.md
          grep -q 'Security release gate' SKILL.md
          grep -q 'never trust the client' workflows/security.md
          grep -q 'SECURITY GATES PASSED FOR CURRENT TESTED SCOPE' workflows/security.md
          grep -q 'AUDIT → THREAT MODEL → ATTACK TEST' SKILL.md
          grep -q 'AUDIT → BACKUP → PLAN → VERIFY RECOVERY' workflows/deployment.md
          grep -q 'Direct internet → origin HTTPS' workflows/cloudflare-origin-security.md
          grep -q 'Strict workflow applicability gate' SKILL.md
          grep -q 'Mandatory consumer trust and anti-deception gate' SKILL.md
          grep -q 'There is no silent \*\*SKIPPED\*\* state' SKILL.md
          grep -q 'Every file under' templates/WORKFLOW-COVERAGE-MATRIX.md
          grep -q 'PRD → TRD → App Flow → Design Brief → Background Schema → Documentation Plan → Production' SKILL.md
          grep -q 'Production entry remains BLOCKED' templates/PRE-PRODUCTION-GATES.md

      - name: Reject common secret/artifact files
        shell: bash
        run: |
          set -euo pipefail
          ! find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'credentials.json' -o -name 'service-account*.json' \) -not -path './.git/*' | grep -q .
          ! find . -type d \( -name node_modules -o -name .next -o -name dist -o -name build -o -name .expo \) -not -path './.git/*' | grep -q .
