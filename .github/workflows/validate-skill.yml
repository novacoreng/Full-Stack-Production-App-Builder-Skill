name: Validate Skill Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required skill files
        shell: bash
        run: |
          set -euo pipefail
          test -f SKILL.md
          test -f README.md
          grep -q '^---$' SKILL.md
          grep -q '^name: full-stack-production-app-builder$' SKILL.md
          grep -q '^description:' SKILL.md
          test -f workflows/infrastructure.md
          test -f workflows/test-admin.md
          test -f workflows/supply-chain.md
          test -f workflows/reliability.md
          test -f workflows/regulatory-compliance.md
          test -f templates/INFRASTRUCTURE-MATRIX.md
          test -f templates/TEST-ADMIN.md
          test -f templates/REGULATORY-MATRIX.md
          test -f references/standards.md

      - name: Reject common secret/artifact files
        shell: bash
        run: |
          set -euo pipefail
          ! find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'credentials.json' -o -name 'service-account*.json' \) -not -path './.git/*' | grep -q .
          ! find . -type d \( -name node_modules -o -name .next -o -name dist -o -name build -o -name .expo \) -not -path './.git/*' | grep -q .
